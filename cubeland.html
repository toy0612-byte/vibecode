v><script>
'use strict';
// 외부 의존성이 없는 순수 JavaScript: 오프라인에서도 실행됩니다.
let names=['플레이어 1','플레이어 2'];
const SIZE=10, MAX_PER_PLAYER=24, boardEl=document.getElementById('board');
let cells, active, player, turns, score, wins, finished, showHints=false, sound=true, message='';
const $=id=>document.getElementById(id);
const neighbors=i=>[i%10>0?i-1:-1,i%10<9?i+1:-1,i>=10?i-10:-1,i<90?i+10:-1].filter(x=>x>=0);
const key=points=>{let minX=Math.min(...points.map(p=>p[0])),minY=Math.min(...points.map(p=>p[1]));return points.map(([x,y])=>`${x-minX},${y-minY}`).sort().join(';')};
const variants=points=>{let set=new Set();for(let mirror=0;mirror<2;mirror++)for(let rot=0;rot<4;rot++){let out=points.map(([x,y])=>{if(mirror)x=-x;for(let r=0;r<rot;r++)[x,y]=[-y,x];return[x,y]});set.add(key(out))}return set};
const canonical=points=>[...variants(points)].sort()[0];
const add=(a,b)=>a.map((v,i)=>v+b[i]);const neg=a=>a.map(v=>-v);const eq=(a,b)=>a.every((v,i)=>v===b[i]);
// 각 면의 법선(n), 오른쪽(r), 아래쪽(d)을 3D로 전파하여 접힘 검사.
function folds(points){const map=new Map(points.map((p,i)=>[p.join(','),i]));let orient=Array(6).fill(null);orient[0]={n:[0,0,1],r:[1,0,0],d:[0,1,0]};let q=[0];while(q.length){let i=q.shift(),[x,y]=points[i],o=orient[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let j=map.get(`${x+dx},${y+dy}`);if(j===undefined)continue;let next=dx===1?{n:o.r,r:neg(o.n),d:o.d}:dx===-1?{n:neg(o.r),r:o.n,d:o.d}:dy===1?{n:o.d,r:o.r,d:neg(o.n)}:{n:neg(o.d),r:o.r,d:o.n};if(!orient[j]){orient[j]=next;q.push(j)}else if(!eq(orient[j].n,next.n)||!eq(orient[j].r,next.r)||!eq(orient[j].d,next.d))return false}}return orient.every(Boolean)&&new Set(orient.map(o=>o.n.join(','))).size===6}
// 연결된 6-정사각형을 모두 열거하여 11개의 정육면체 전개도 클래스를 생성.
function generateNets(){let shapes=new Map([[canonical([[0,0]]),[[0,0]]]]);for(let n=2;n<=6;n++){let next=new Map();for(let shape of shapes.values()){let occupied=new Set(shape.map(p=>p.join(',')));for(let [x,y] of shape)for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let p=[x+dx,y+dy];if(occupied.has(p.join(',')))continue;let candidate=[...shape,p],id=canonical(candidate);if(!next.has(id))next.set(id,candidate)}}shapes=next}return new Set([...shapes].filter(([id,p])=>folds(p)).map(([id])=>id))}
const NETS=generateNets();if(NETS.size!==11)throw Error(`전개도 판정 초기화 오류: ${NETS.size}개`);
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
$('close').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const instructions='<p><b>목표:</b> 번갈아 한 칸씩 땅을 차지해 정육면체 전개도를 완성하세요.</p><ol><li>각 팀은 첫 칸을 아무 빈 곳에 놓습니다.</li><li>그다음부터는 <b>현재 만들고 있는 땅과 변으로 맞닿은 빈 칸</b>만 선택합니다.</li><li>6칸을 놓는 즉시 정육면체 전개도인지 자동 판정합니다.</li><li><b>성공:</b> 10점! 6칸이 확정 영토가 됩니다. <b>실패:</b> 0점, 6칸은 회색 장애물로 남습니다.</li><li>성공과 실패 모두 다음 차례에는 다른 빈 위치에서 새 전개도를 시작합니다.</li><li>팀당 24턴(최대 4번 도전), 총 48턴 후 점수가 높은 팀이 승리합니다.</li></ol><p>회전하거나 뒤집은 전개도도 정답으로 인정해요. 상대 팀이나 확정·실패한 땅에는 놓을 수 없어요.</p>';
$('help').onclick=()=>modal('🧊 큐브랜드 게임 방법',instructions);
const galleryNets=()=>{const result=[];const seen=new Set();let shapes=new Map([[canonical([[0,0]]),[[0,0]]]]);for(let n=2;n<=6;n++){const next=new Map();for(const shape of shapes.values()){const occupied=new Set(shape.map(p=>p.join(',')));for(const [x,y] of shape)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const p=[x+dx,y+dy];if(occupied.has(p.join(',')))continue;const candidate=[...shape,p],id=canonical(candidate);if(!next.has(id))next.set(id,candidate)}}shapes=next}for(const [id,points] of shapes){if(folds(points)&&!seen.has(id)){seen.add(id);result.push(points)}}return result.sort((a,b)=>canonical(a).localeCompare(canonical(b)))};
let galleryShapes=[], foldAnimation=0;
function showNets(){cancelAnimationFrame(foldAnimation);galleryShapes=galleryNets();const items=galleryShapes.map((points,i)=>{const minX=Math.min(...points.map(p=>p[0])),minY=Math.min(...points.map(p=>p[1]));const normalized=points.map(([x,y])=>[x-minX,y-minY]);const w=Math.max(...normalized.map(p=>p[0]))+1,h=Math.max(...normalized.map(p=>p[1]))+1;const unit=28;const x0=(144-w*unit)/2,y0=(144-h*unit)/2;const rects=normalized.map(([x,y])=>`<rect x="${x0+x*unit}" y="${y0+y*unit}" width="${unit}" height="${unit}" rx="2" fill="#85b7f7" stroke="#2859aa" stroke-width="1.7"/>`).join('');return `<button type="button" class="net-item" data-net="${i}" aria-label="${i+1}번 전개도 접기"><b>${i+1}번 전개도</b><svg viewBox="0 0 144 144" role="img" aria-label="${i+1}번 정육면체 전개도">${rects}</svg><small>눌러서 접기 ▶</small></button>`}).join('');modal('🧩 정육면체 전개도',`<p class="net-intro"><b>전개도를 클릭하면 정육면체가 만들어집니다!</b><br>11가지 중 원하는 전개도를 눌러 접히는 모습을 관찰해 보세요.</p><div class="net-gallery">${items}</div>`);document.querySelectorAll('[data-net]').forEach(el=>el.addEventListener('click',()=>showFold(Number(el.dataset.net))))}
const vadd=(a,b)=>a.map((x,i)=>x+b[i]),vscale=(a,k)=>a.map(x=>x*k),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((t,x,i)=>t+x*b[i],0);
function rotate3(v,axis,angle){const c=Math.cos(angle),sn=Math.sin(angle);return vadd(vadd(vscale(v,c),vscale(cross(axis,v),sn)),vscale(axis,dot(axis,v)*(1-c)))}
function foldGeometry(points,t){const map=new Map(points.map((p,i)=>[p.join(','),i]));const out=Array(6);const queue=[0];out[0]={c:[0,0,0],r:[1,0,0],d:[0,1,0],n:[0,0,1]};while(queue.length){const i=queue.shift(),[x,y]=points[i],o=out[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const j=map.get(`${x+dx},${y+dy}`);if(j===undefined||out[j])continue;const axis=dx!==0?o.d:o.r;const angle=(dx===1?1:dx===-1?-1:dy===1?-1:1)*t*Math.PI/2;const r=rotate3(o.r,axis,angle),d=rotate3(o.d,axis,angle),n=rotate3(o.n,axis,angle);const c=vadd(o.c,vadd(vscale(dx!==0?o.r:o.d,(dx||dy)*.5),vscale(dx!==0?r:d,(dx||dy)*.5)));out[j]={c,r,d,n};queue.push(j)}}return out}
function showFold(index){cancelAnimationFrame(foldAnimation);const points=galleryShapes[index];modal(`🧊 ${index+1}번 전개도 접기`,`<div class="fold-view"><p class="fold-message" id="foldMsg">전개도가 움직이면서 정육면체로 접힙니다.</p><canvas id="foldCanvas" role="img" aria-label="평면 전개도가 입체 정육면체로 접히는 애니메이션"></canvas><div class="fold-actions"><button type="button" class="secondary" id="backNets">← 전개도 목록</button><button type="button" id="replayFold">↻ 다시 접기</button></div><p class="fold-message">완성된 정육면체를 손가락이나 마우스로 드래그하여 돌려 보세요.</p></div>`);$('backNets').onclick=showNets;$('replayFold').onclick=()=>animateFold(points);animateFold(points)}
function animateFold(points){cancelAnimationFrame(foldAnimation);const canvas=$('foldCanvas'),ctx=canvas.getContext('2d');if(!ctx)return;let angleY=-.6,angleX=.48,progress=0,start=0,drag=false,px=0,py=0;
function project(p){let [x,y,z]=p;let cy=Math.cos(angleY),sy=Math.sin(angleY),cx=Math.cos(angleX),sx=Math.sin(angleX);let x1=cy*x+sy*z,z1=-sy*x+cy*z,y1=cx*y-sx*z,z2=sx*y+cx*z1;return [x1,y1,z2]}
function draw(t){if(!canvas.isConnected)return;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,rect.width),h=Math.max(1,rect.height);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const faces=foldGeometry(points,t),polys=faces.map((o,i)=>{const vertices=[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]].map(([a,b])=>project(vadd(o.c,vadd(vscale(o.r,a),vscale(o.d,b)))));return {i,vertices,depth:vertices.reduce((s,p)=>s+p[2],0)/4}});const all=polys.flatMap(f=>f.vertices);const minX=Math.min(...all.map(p=>p[0])),maxX=Math.max(...all.map(p=>p[0])),minY=Math.min(...all.map(p=>p[1])),maxY=Math.max(...all.map(p=>p[1]));const scale=Math.min(w*.83/Math.max(1.5,maxX-minX),h*.83/Math.max(1.5,maxY-minY)),cx=w/2-(minX+maxX)/2*scale,cy=h/2-(minY+maxY)/2*scale;const colors=['#70a9f5','#f5ac76','#91d5b1','#c1a4f5','#f6d779','#f18f9e'];polys.sort((a,b)=>a.depth-b.depth).forEach(f=>{ctx.beginPath();f.vertices.forEach((p,k)=>{const x=cx+p[0]*scale,y=cy+p[1]*scale;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=colors[f.i];ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#34587c';ctx.stroke();const center=f.vertices.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);ctx.fillStyle='#17375c';ctx.font=`bold ${Math.max(12,Math.min(20,scale*.26))}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(f.i+1),cx+center[0]*scale,cy+center[1]*scale)})}
function frame(ts){if(!canvas.isConnected)return;if(!start)start=ts;progress=Math.min(1,(ts-start)/2400);const eased=progress*progress*(3-2*progress);draw(eased);if(progress<1)foldAnimation=requestAnimationFrame(frame);else if($('foldMsg'))$('foldMsg').textContent='완성! 여섯 면이 만나 정육면체가 되었어요. 🎉'}
canvas.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;angleY+=(e.clientX-px)*.012;angleX+=(e.clientY-py)*.012;px=e.clientX;py=e.clientY;draw(progress*progress*(3-2*progress))};canvas.onpointerup=canvas.onpointercancel=()=>{drag=false};foldAnimation=requestAnimationFrame(frame)}
$('rules').onclick=showNets;
$('startButton').onclick=()=>{names=[$('input1').value.trim()||'플레이어 1',$('input2').value.trim()||'플레이어 2'];$('name1').textContent=names[0];$('name2').textContent=names[1];$('startScreen').classList.add('hidden');newGame()};
$('home').onclick=()=>{if(!finished&&(turns[0]+turns[1])>0&&!confirm('진행 중인 게임을 종료하고 시작 화면으로 돌아갈까요?'))return;$('startScreen').classList.remove('hidden')};
$('hint').onclick=()=>{showHints=!showHints;render()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 소리 켬':'🔇 소리 끔'};
$('reset').onclick=()=>{if(confirm('현재 게임을 지우고 새로 시작할까요?'))newGame()};
function beep(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=ok?660:260;gain.gain.setValueAtTime(.07,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);osc.start();osc.stop(ctx.currentTime+.19);osc.onended=()=>ctx.close()}catch(e){}}
function newGame(){cells=Array(100).fill(null);active=[[],[]];player=0;turns=[0,0];score=[0,0];wins=[0,0];finished=false;message=names[0]+'부터 시작!';render()}
function possible(i){return cells[i]===null&&(active[player].length===0||neighbors(i).some(j=>active[player].includes(j)))}
function place(i){if(finished||!possible(i))return;cells[i]={owner:player,state:'active'};active[player].push(i);turns[player]++;let who=player;if(active[who].length===6){let pts=active[who].map(k=>[k%10,Math.floor(k/10)]);let success=NETS.has(canonical(pts));for(let j of active[who])cells[j].state=success?'locked':'failed';if(success){score[who]+=10;wins[who]++;message=`${names[who]} 성공! 정육면체 전개도 완성 (+10점) 🎉`}else{message=`${names[who]} 아쉬워요! 접히지 않는 모양이에요.`}active[who]=[];beep(success)}else message=`${names[who]}: ${active[who].length}/6칸 배치 완료`;
player=1-player;if(turns[0]===MAX_PER_PLAYER&&turns[1]===MAX_PER_PLAYER){finish();return}if(turns[player]>=MAX_PER_PLAYER||!cells.some((_,j)=>possible(j))){let other=1-player;player=other;if(turns[other]>=MAX_PER_PLAYER||!cells.some((_,j)=>possible(j))){finish();return}}render()}
function finish(){finished=true;render();let text=score[0]===score[1]?'무승부입니다!':score[0]>score[1]?names[0]+' 승리!':names[1]+' 승리!';modal('🏆 게임 종료',`<p><b>${text}</b></p><p>${names[0]}: ${score[0]}점 · 전개도 ${wins[0]}개<br>${names[1]}: ${score[1]}점 · 전개도 ${wins[1]}개</p><p>어떤 모양이 정육면체로 접히는지 친구와 이야기해 보세요.</p>`)}
function render(){boardEl.replaceChildren();for(let i=0;i<100;i++){let b=document.createElement('button');b.type='button';b.className='cell';let c=cells[i];if(c){b.classList.add('p'+(c.owner+1));if(c.state==='locked')b.classList.add('locked');if(c.state==='failed'){b.classList.remove('p'+(c.owner+1));b.classList.add('failed')}if(c.state==='active')b.classList.add('active')}else if(showHints&&!finished&&possible(i))b.classList.add('valid');b.disabled=finished||!possible(i);b.setAttribute('aria-label',`${Math.floor(i/10)+1}행 ${i%10+1}열 ${c?(c.owner===0?'파란':'빨간')+' 팀 '+c.state:'빈 칸'}`);b.onclick=()=>place(i);boardEl.append(b)}$('s1').textContent=score[0]+'점';$('s2').textContent=score[1]+'점';$('c1').textContent=`완성 ${wins[0]}개 · ${turns[0]}/24턴`;$('c2').textContent=`완성 ${wins[1]}개 · ${turns[1]}/24턴`;$('p1').classList.toggle('on',!finished&&player===0);$('p2').classList.toggle('on',!finished&&player===1);$('heading').textContent=finished?'게임 종료':(player===0?'🔵 ':'🔴 ')+names[player]+' 차례';$('guide').textContent=finished?'새 게임을 눌러 다시 도전하세요.':active[player].length===0?'새 전개도의 첫 칸을 자유롭게 선택하세요.':`현재 ${active[player].length}/6칸. 색칠한 칸과 변이 닿도록 확장하세요.`;$('bar').style.width=((turns[0]+turns[1])/48*100)+'%';$('status').textContent=message;$('round').textContent=`총 ${turns[0]+turns[1]} / 48턴 · 팀당 24턴`;$('hint').textContent=showHints?'💡 표시 끄기':'💡 가능 칸'}
newGame();
</script></body></html>
